      description: <p>Previously, ConsumeKafka / GetKafka added the kafka key as an
        attribute to the flowfile, assuming that the key was in UTF-8 format. Recently,
        this was changed to use a hex encoding. This could break flows, as it is not
        backward compatible. We should instead make this a configurable option with
        the default being UTF-8 Encoded.</p>
