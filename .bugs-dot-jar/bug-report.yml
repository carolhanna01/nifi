      description: "<p>This is a JIRA which spawned from the discussion/review efforts\
        \ folks did on <a href=\"https://issues.apache.org/jira/browse/NIFI-1651\"\
        \ title=\"nifi-kite-processors unit tests broken on windows\" class=\"issue-link\"\
        \ data-issue-key=\"NIFI-1651\"><del>NIFI-1651</del></a>.</p>\n\n<p>Sorry for\
        \ the delay... I am on a different computer than usual and forgot to check\
        \ the git property. Did a full clone again (so slow with airport wifi...)\
        \ and checked the schema (looks OK to me). The git property solved most of\
        \ the issues, but some are remaining:</p>\n\n<p>Running org.apache.nifi.processors.kite.TestAvroRecordConverter<br/>\n\
        Tests run: 4, Failures: 0, Errors: 1, Skipped: 0, Time elapsed: 0.377 sec\
        \ &lt;&lt;&lt; FAILURE! - in org.apache.nifi.processors.kite.TestAvroRecordConverter<br/>\n\
        testDefaultConversion(org.apache.nifi.processors.kite.TestAvroRecordConverter)\
        \  Time elapsed: 0.011 sec  &lt;&lt;&lt; ERROR!<br/>\norg.apache.nifi.processors.kite.AvroRecordConverter$AvroConversionException:\
        \ Cannot convert 5.5 to double<br/>\n        at org.apache.nifi.processors.kite.AvroRecordConverter.convertData(AvroRecordConverter.java:246)<br/>\n\
        \        at org.apache.nifi.processors.kite.AvroRecordConverter.convert(AvroRecordConverter.java:170)<br/>\n\
        \        at org.apache.nifi.processors.kite.TestAvroRecordConverter.testDefaultConversion(TestAvroRecordConverter.java:98)</p>\n\
        \n<p>Running org.apache.nifi.processors.kite.TestConfigurationProperty<br/>\n\
        Tests run: 2, Failures: 0, Errors: 0, Skipped: 0, Time elapsed: 0.849 sec\
        \ - in org.apache.nifi.processors.kite.TestConfigurationProperty<br/>\nRunning\
        \ org.apache.nifi.processors.kite.TestConvertAvroSchema<br/>\nTests run: 2,\
        \ Failures: 1, Errors: 0, Skipped: 0, Time elapsed: 0.22 sec &lt;&lt;&lt;\
        \ FAILURE! - in org.apache.nifi.processors.kite.TestConvertAvroSchema<br/>\n\
        testBasicConversion(org.apache.nifi.processors.kite.TestConvertAvroSchema)\
        \  Time elapsed: 0.21 sec  &lt;&lt;&lt; FAILURE!<br/>\njava.lang.AssertionError:\
        \ Should convert 2 rows expected:&lt;2&gt; but was:&lt;1&gt;<br/>\n      \
        \  at org.junit.Assert.fail(Assert.java:88)<br/>\n        at org.junit.Assert.failNotEquals(Assert.java:834)<br/>\n\
        \        at org.junit.Assert.assertEquals(Assert.java:645)<br/>\n        at\
        \ org.apache.nifi.processors.kite.TestConvertAvroSchema.testBasicConversion(TestConvertAvroSchema.java:78)</p>\n\
        \n\n<p>Just for the record, the error is because of my local env. This is\
        \ fixed by setting the locale to US on the scanner:</p>\n\n<p>scanner.useLocale(java.util.Locale.US);</p>\n\
        \n<p>I don't know if there is a way to set this at a global scale.</p>"
