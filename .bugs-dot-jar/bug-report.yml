      description: "<p>The <tt>FetchSFTP</tt> processor relies on the shared <tt>SFTPTransfer</tt>\
        \ class to handle SFTP communication using the SSHJ library starting in NiFi\
        \ 1.12.0.\_ The <tt>SFTPTransfer</tt> class instantiates and configures an\
        \ <tt>SSHClient</tt> based on processor properties, calling the <tt>connect</tt>\
        \ method after initial configuration.</p>\n\n<p>The <tt>SSHClient.connect</tt>\
        \ method can throw an <tt>IOException</tt> on failure to reach the remote\
        \ SFTP server, but the NiFi <tt>SFTPTransfer</tt> class does not close in\
        \ the <tt>SSHClient</tt>.\_ Although <tt>FetchSFTP</tt> catches the <tt>IOException</tt>\
        \ in the parent <tt>FetchFileTransfer.onTrigger</tt> method, the processor\
        \ never closes the failed <tt>SSHClient</tt> because <tt>SFTPTransfer</tt>\
        \ never assigned the instance variable.</p>\n\n<p>The creation and lifecycle\
        \ of the <tt>SSHClient</tt> inside <tt>SFTPTransfer</tt> should be adjusted\
        \ to ensure closure of <tt>SSHClient</tt> and the associated keep-alive thread.</p>"
