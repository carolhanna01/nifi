      description: "<p>Originally reported on the Apache NiFi Slack.</p>\n\n<p>when\
        \ groups are removed in ldap, it impacts access policies that had the group\
        \ id.</p>\n\n<p><a href=\"https://apachenifi.slack.com/archives/C0L9UPWJZ/p1549493200163800\"\
        \ class=\"external-link\" target=\"_blank\" rel=\"nofollow noopener\">https://apachenifi.slack.com/archives/C0L9UPWJZ/p1549493200163800</a></p>\n\
        \n<p>This relates to <a href=\"https://issues.apache.org/jira/browse/NIFI-5948\"\
        \ title=\"Cannot list users when a ldap user that belongs to a group is deleted\"\
        \ class=\"issue-link\" data-issue-key=\"NIFI-5948\"><del>NIFI-5948</del></a>.</p>\n\
        \n<p>Steps to reproduce:</p>\n<ol>\n\t<li>Configure NiFi to use the LDAP\_\
        UserGroupProvider.</li>\n\t<li>Then in Nifi, using the UI, create some access\
        \ policies that contain the LDAP groups.</li>\n\t<li>Delete groups from LDAP\
        \ or change the NiFi LdapUserGroupProvider to use a different group search\
        \ base/filter such that a subset of groups are returned, and at least one\
        \ group that belongs to an access policy is no longer synced from ldap.</li>\n\
        \t<li>Go to buger menu -&gt; users as observe an NPE. stack trace below</li>\n\
        </ol>\n\n\n<p>The only way to fix this problem\_is to delete the association\
        \ of the access policy -&gt; group\_in the file: authorizations.xml.</p>\n\
        \n<p><ins><b>Stack trace:</b></ins></p>\n\n<p>\_</p>\n<div class=\"preformatted\
        \ panel\" style=\"border-width: 1px;\"><div class=\"preformattedContent panelContent\"\
