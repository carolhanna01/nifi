      description: '<p>If "Custom" is set as the format in CSVReader when "Jackson
        CSV" is set for the CSV Parser property, a NullPointerException occurs.</p>


        <p>This is because there is no Record Separator property available for CSVReader,
        so the value is null when retrieved to configure the Jackson CSV parser. The
        Jackson CSV Parser code in NiFi should be updated to check for null and default
        to the newline character sequence, and the Record Separator property should
        be exposed in the CSVReader in order to ensure it is set (and can be configured
        by the user), as was done for the ConvertExcelToCSVProcessor.</p>'
