        comment:
        - '#text': <p>I deployed the fix to my cluster, after the change the problem
            dissapeared</p>
          '@author': taz1988
          '@created': Thu, 16 Nov 2023 23:23:15 +0000
          '@id': '17786967'
        - '#text': '<p>Thanks for summarizing this issue <a href="https://issues.apache.org/jira/secure/ViewProfile.jspa?name=taz1988"
            class="user-hover" rel="taz1988">taz1988</a>.</p>


            <p>Do you know if the <tt>h2</tt> protocol was enabled for the HTTP protocols
            property in nifi.properties? The HTTP/2 protocol uses binary for headers,
            and as a result, the header names can be reported as lowercase when HTTP/2
            is negotiated.</p>'
          '@author': exceptionfactory
          '@created': Fri, 17 Nov 2023 00:08:58 +0000
          '@id': '17786987'
        - '#text': '<p>Commit 63364687d8bbe2af2d0031f745ca3c61144f8b4f in nifi''s
            branch refs/heads/main from Zoltan Kornel Torok<br/>

            [ <a href="https://gitbox.apache.org/repos/asf?p=nifi.git;h=63364687d8"
            class="external-link" target="_blank" rel="nofollow noopener">https://gitbox.apache.org/repos/asf?p=nifi.git;h=63364687d8</a>
            ]</p>


            <p><a href="https://issues.apache.org/jira/browse/NIFI-12383" title="GZipException
            occur during cluster replication, when the original request contains &quot;accept-encoding&quot;
            header with lowercase" class="issue-link" data-issue-key="NIFI-12383"><del>NIFI-12383</del></a>
            Replication client should handle accept encoding with lowercase</p>


            <p>Signed-off-by: Bence Simon &lt;bsimon@apache.org&gt;<br/>

            This closes #8043</p>'
          '@author': jira-bot
          '@created': Fri, 17 Nov 2023 07:02:24 +0000
          '@id': '17787062'
        - '#text': '<p><a href="https://issues.apache.org/jira/secure/ViewProfile.jspa?name=exceptionfactory"
            class="user-hover" rel="exceptionfactory">exceptionfactory</a>,<br/>

            As I see &lt;nifi.web.https.application.protocols&gt;h2 http/1.1&lt;/nifi.web.https.application.protocols&gt;
            is the default, so I guess that means yes? (I didn''t override this value)</p>'
          '@author': taz1988
          '@created': Fri, 17 Nov 2023 08:58:55 +0000
          '@id': '17787089'
        - '#text': '<p>Commit 4e38e28d050d4ddcf766860ef820cb79aa8cfbc7 in nifi''s
            branch refs/heads/support/nifi-1.x from Zoltan Kornel Torok<br/>

            [ <a href="https://gitbox.apache.org/repos/asf?p=nifi.git;h=4e38e28d05"
            class="external-link" target="_blank" rel="nofollow noopener">https://gitbox.apache.org/repos/asf?p=nifi.git;h=4e38e28d05</a>
            ]</p>


            <p><a href="https://issues.apache.org/jira/browse/NIFI-12383" title="GZipException
            occur during cluster replication, when the original request contains &quot;accept-encoding&quot;
            header with lowercase" class="issue-link" data-issue-key="NIFI-12383"><del>NIFI-12383</del></a>
            Replication client should handle accept encoding with lowercase</p>


            <p>Signed-off-by: Bence Simon &lt;bsimon@apache.org&gt;<br/>

            This closes #8043</p>'
          '@author': jira-bot
          '@created': Fri, 17 Nov 2023 10:00:10 +0000
          '@id': '17787116'
        - '#text': '<p>Thanks for the reply <a href="https://issues.apache.org/jira/secure/ViewProfile.jspa?name=taz1988"
            class="user-hover" rel="taz1988">taz1988</a>.</p>


            <p>The <tt>h2</tt> protocol is now the default on the main branch, but
            it was not the default for NiFi 1, so that is why I asked.</p>


            <p>The change itself is simple enough, so it is not so much of a concern,
            but it would be useful to know the NiFi version and configured property
            value if you have that information available for reference.</p>'
          '@author': exceptionfactory
          '@created': Fri, 17 Nov 2023 14:49:14 +0000
          '@id': '17787241'
        - '#text': <p>Oh I see. It was a nifi-2.0 cluster what I played with where
            this error occured</p>
