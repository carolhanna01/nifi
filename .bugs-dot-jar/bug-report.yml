      description: "<p>Just attempted to upgrade from version 1.17.0 to 1.19.0, and\
        \ I'm now getting the following error message in ConsumeKafkaRecord_2_6:</p>\n\
        <div class=\"code panel\" style=\"border-width: 1px;\"><div class=\"codeContent\
        \ panelContent\">\n<pre class=\"code-java\">\n2022-12-01 13:16:31,886 ERROR\
        \ [Timer-Driven <span class=\"code-object\">Process</span> <span class=\"\
        code-object\">Thread</span>-10] o.a.n.p.k.pubsub.ConsumeKafkaRecord_2_6 ConsumeKafkaRecord_2_6[id=8cd134b7-ae49-19d2-0000-00007edbb2f4]\
        \ Processing halted: yielding [1 sec]\njava.lang.IllegalArgumentException:\
        \ No <span class=\"code-keyword\">enum</span> constant org.apache.nifi.kafka.shared.property.SaslMechanism.SCRAM-SHA-512\n\
        \        at java.base/java.lang.Enum.valueOf(Enum.java:240)\n        at org.apache.nifi.kafka.shared.property.SaslMechanism.valueOf(SaslMechanism.java:24)\n\
        \        at org.apache.nifi.kafka.shared.login.DelegatingLoginConfigProvider.getConfiguration(DelegatingLoginConfigProvider.java:50)\n\
        \        at org.apache.nifi.kafka.shared.property.provider.StandardKafkaPropertyProvider.setSecurityProperties(StandardKafkaPropertyProvider.java:83)\n\
        \        at org.apache.nifi.kafka.shared.property.provider.StandardKafkaPropertyProvider.getProperties(StandardKafkaPropertyProvider.java:72)\n\
        \        at org.apache.nifi.processors.kafka.pubsub.ConsumeKafkaRecord_2_6.createConsumerPool(ConsumeKafkaRecord_2_6.java:427)\n\
        \        at org.apache.nifi.processors.kafka.pubsub.ConsumeKafkaRecord_2_6.getConsumerPool(ConsumeKafkaRecord_2_6.java:399)\n\
        \        at org.apache.nifi.processors.kafka.pubsub.ConsumeKafkaRecord_2_6.onTrigger(ConsumeKafkaRecord_2_6.java:519)\n\
        \        at org.apache.nifi.processor.AbstractProcessor.onTrigger(AbstractProcessor.java:27)\n\
        \        at org.apache.nifi.controller.StandardProcessorNode.onTrigger(StandardProcessorNode.java:1356)\n\
        \        at org.apache.nifi.controller.tasks.ConnectableTask.invoke(ConnectableTask.java:246)\n\
        \        at org.apache.nifi.controller.scheduling.TimerDrivenSchedulingAgent$1.run(TimerDrivenSchedulingAgent.java:102)\n\
        \        at org.apache.nifi.engine.FlowEngine$2.run(FlowEngine.java:110)\n\
        \        at java.base/java.util.concurrent.Executors$RunnableAdapter.call(Executors.java:515)\n\
        \        at java.base/java.util.concurrent.FutureTask.runAndReset(FutureTask.java:305)\n\
        \        at java.base/java.util.concurrent.ScheduledThreadPoolExecutor$ScheduledFutureTask.run(ScheduledThreadPoolExecutor.java:305)\n\
        \        at java.base/java.util.concurrent.ThreadPoolExecutor.runWorker(ThreadPoolExecutor.java:1128)\n\
        \        at java.base/java.util.concurrent.ThreadPoolExecutor$Worker.run(ThreadPoolExecutor.java:628)\n\
        \        at java.base/java.lang.<span class=\"code-object\">Thread</span>.run(<span\
        \ class=\"code-object\">Thread</span>.java:829)\n</pre>\n</div></div>\n<p>I'm\
        \ guessing this might be related to <a href=\"https://issues.apache.org/jira/browse/NIFI-10819\"\
        \ class=\"external-link\" rel=\"nofollow\">https://issues.apache.org/jira/browse/NIFI-10819</a>.\
        \ I don't speak Java, but guessing it might further be related to <a href=\"\
        https://github.com/apache/nifi/pull/6690/commits/23eac09f05354aa6775e8504fd94ca2bb8c44c62#diff-e3bf34d8321c19887e4e1d2d3474eccfeb55d13ee7f5efbcaaa8964813c2485aR31\"\
        \ class=\"external-link\" target=\"_blank\" rel=\"nofollow noopener\">https://github.com/apache/nifi/pull/6690/commits/23eac09f05354aa6775e8504fd94ca2bb8c44c62#diff-e3bf34d8321c19887e4e1d2d3474eccfeb55d13ee7f5efbcaaa8964813c2485aR31</a><br/>\n\
        Should either the value be SCRAM_SHA_512 or the name of the property/variable/whateveritsnamedinjava\
        \ be SCRAM-SHA-512?</p>"
