      description: '<p>Following recent upgrades to Jetty 12, the HandleHttpRequest
        Processor is not registered the standard Servlet that it uses to handle HTTP
        requests.</p>


        <p>The Jetty ServletContextHandler should be used together with a root path
        mapping to allow HandleHttpRequest to process requests according to configured
        properties.</p>'
