      description: '<p>The clear() command added in <a href="https://issues.apache.org/jira/browse/NIFI-6715"
        title="Metrics of removed/renamed components continues to remain in PrometheusReportingTask"
        class="issue-link" data-issue-key="NIFI-6715"><del>NIFI-6715</del></a> causes
        the registry to be reset on every call to createNiFiMetrics. In the case of
        nested process groups this method is a recursive call, so the registry keeps
        getting cleared except for the last visited process group.</p>


        <p>The clear() should only be done when createNiFiMetrics is called on the
        root process group, in order to clean up the registry before adding all the
        components'' metrics.</p>'
