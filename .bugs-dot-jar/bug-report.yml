      description: '<p>As a result of recent updates to the NarUnpacker class, additional
        details documentation is not linked from component documentation pages.</p>


        <p>The documentation generator depends on the existence of the additionalDetails.html
        at a specific location in the documentation work directory. The NarUnpacker
        is responsible for reading NAR files processing JAR files to find an extract
        documentation files based on an expected relative path in the JAR containing
        the component class. Adjustments to the unpack processing to reuse a shared
        JAR file entry method resulted in failing to find the expected relative path.
        Without the matched relative path, the NarUnpacker does not extract JAR file
        entries containing the additional details documentation.</p>'
